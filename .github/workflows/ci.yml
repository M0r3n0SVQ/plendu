name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel in-progress runs for the same branch — saves minutes on
# rapid-fire pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Disable Next.js telemetry on CI.
      NEXT_TELEMETRY_DISABLED: '1'
      # Sentry sourcemap upload is opt-in; the build succeeds without it.
      # We deliberately don't expose SENTRY_AUTH_TOKEN here — the wrapper
      # in next.config.mjs swallows upload failures.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Lets the lighthouse job below reuse this exact build instead of
      # recompiling from scratch — `next build` is the expensive step, and
      # nothing about it differs between the two jobs. A single bare
      # directory path (no exclusions/multiple entries) is deliberate: with
      # more than one path, upload-artifact re-roots the archive at their
      # least common ancestor, which would double-nest .next on download —
      # not worth the risk for the ~300KB build cache this would trim.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-build
    # Only PRs — a fresh preview isn't needed on every push to master, and
    # this is where a "design" change could quietly regress Core Web Vitals
    # or accessibility without anyone noticing.
    if: github.event_name == 'pull_request'

    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.lighthouserc.json'
